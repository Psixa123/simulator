<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Store Badges</title>
<style>
  @font-face { font-family: "Luckiest Guy"; src: url("fonts/LuckiestGuy-Regular.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
<script src="art.js"></script>
<script src="store3d.js"></script>
</head>
<body>
<script>
  // Gamepass and developer product badges with 3D art (512 x 512, designed on a 1024 grid):
  //   store3d.html?id=VIP   -> one badge (ids = keys of src/shared/Config/Monetization.luau)
  // tools/render_art.py renders them to assets/gamepasses/<Key>.png and assets/products/<Key>.png. The hero
  // pictures are assets/source/store3d/Store_<Key>.png (tools/icons/README.md, "Store icons").
  //
  // Each design: bg = sunburst colours [centre, middle, edge]; hero = [x, y, size] of the 3D render (and an
  // optional turn); glow = [x, y, radius] of the light behind it; floor = [x, y, rx, ry] contact shadow;
  // labels = SVG markup drawn on top; sparkles = [[x, y, r], ...].
  const params = new URLSearchParams(location.search);
  const id = params.get("id") || "VIP";
  const SIZE = Number(params.get("size")) || 512;

  const GOLD = ["#fff2a8", "#ffbe2e", "#c46a00"];
  const SKY = ["#a8f0ff", "#3ab8f5", "#174f9c"];
  const CLOVER = ["#d6ffb8", "#62d45a", "#1f7a34"];
  const TAG_2X = (x = 345, y = 375) => label3d(x, y, "2X", 165, { rot: -12 });
  const SPARKS = [[175, 250, 26], [850, 210, 30], [150, 640, 22], [880, 610, 24], [300, 135, 16], [735, 120, 18]];

  const D = {
    VIP: { bg: GOLD, hero: [512, 480, 660], glow: [512, 465, 340], floor: [512, 740, 260, 40],
           labels: label3d(512, 875, "VIP", 190, { colors: ["#ffffff", "#ffe1f0", "#ff7ab8"] }) },
    DoubleVolts: { bg: GOLD, hero: [565, 540, 670], glow: [560, 520, 340], floor: [565, 805, 270, 40], labels: TAG_2X() },
    DoubleEnergy: { bg: SKY, hero: [560, 510, 660], glow: [555, 490, 330], floor: [560, 800, 200, 32], labels: TAG_2X() },
    AutoCatch: { bg: ["#c4ffd8", "#4fd28a", "#1c7a4a"], hero: [480, 505, 640], glow: [490, 490, 340],
                 labels: banner(512, 825, 470, 132, "AUTO", { c1: "#6fdcff", c2: "#2b86e6" }) },
    RemoteSell: { bg: ["#ffd8b8", "#ff8c4a", "#b43c14"], hero: [520, 475, 700], glow: [520, 450, 350],
                  labels: banner(512, 825, 590, 132, "AUTO SELL", { c1: "#ffe066", c2: "#f09a1a", size: 86 }) },
    MegaTank: { bg: ["#c8d2ff", "#6c7cff", "#26308f"], hero: [560, 495, 720], glow: [555, 480, 350],
                floor: [560, 800, 230, 36], labels: TAG_2X() },
    InfiniteTank: { bg: ["#e2d6ff", "#7860ff", "#2a1580"], hero: [512, 465, 710], glow: [512, 450, 350],
                    labels: banner(512, 825, 590, 132, "INFINITE", { c1: "#ffe066", c2: "#f0a01a", size: 92 }) },
    LuckyHatcher: { bg: CLOVER, hero: [530, 445, 700], glow: [520, 430, 350], floor: [520, 735, 240, 36],
                    labels: banner(512, 825, 590, 132, "+50% LUCK", { c1: "#ffe066", c2: "#f09a1a", size: 86 }) },
    TripleHatch: { bg: ["#ffd8ef", "#ff8ac8", "#a8357a"], hero: [512, 470, 780], glow: [512, 440, 380],
                   floor: [512, 760, 320, 44], labels: label3d(512, 885, "X3", 190) },
    AutoHatch: { bg: ["#e8d2ff", "#a678ff", "#4a2a9c"], hero: [512, 465, 710], glow: [512, 450, 340],
                 labels: banner(512, 825, 470, 132, "AUTO", { c1: "#ff9ad0", c2: "#e0459a" }) },
    PetSlots: { bg: ["#ffcfe0", "#ff6f9a", "#a82a52"], hero: [512, 480, 770], glow: [512, 470, 370],
                floor: [512, 665, 320, 46], labels: banner(512, 825, 560, 132, "+3 SLOTS", { c1: "#ffe066", c2: "#f09a1a", size: 92 }) },
    StormRadar: { bg: ["#b8fff2", "#38c9b0", "#0f5a62"], hero: [505, 480, 660], glow: [505, 460, 340],
                  labels: banner(512, 825, 520, 132, "RADAR", { c1: "#ff8ac8", c2: "#c93a8f" }) },
    VoltsSmall: { bg: GOLD, hero: [512, 485, 700], glow: [512, 470, 340], floor: [512, 790, 250, 36] },
    VoltsMedium: { bg: GOLD, hero: [512, 495, 710], glow: [512, 480, 350], floor: [512, 815, 260, 38] },
    VoltsLarge: { bg: ["#fff2a8", "#ffa62e", "#b85000"], hero: [512, 495, 800], glow: [512, 470, 380], floor: [512, 790, 320, 44] },
    VoltsHuge: { bg: ["#fff6b8", "#ffb21e", "#a84600"], hero: [512, 470, 730], glow: [512, 450, 370],
                 labels: banner(512, 825, 600, 132, "BEST VALUE", { c1: "#ff7a9a", c2: "#d93a62", size: 82 }) },
    EnergyBoost: { bg: SKY, hero: [560, 460, 660], glow: [550, 445, 320], labels: TAG_2X() +
                   banner(512, 825, 470, 124, "30 MIN", { c1: "#ffe066", c2: "#f09a1a", size: 88 }) },
    LuckBoost: { bg: CLOVER, hero: [560, 460, 660], glow: [550, 445, 320], labels: TAG_2X() +
                 banner(512, 825, 470, 124, "30 MIN", { c1: "#ffe066", c2: "#f09a1a", size: 88 }) },
    SummonMegaStorm: { bg: ["#dcb8ff", "#7c3aed", "#2a0e6a"], hero: [512, 480, 700], glow: [512, 450, 360],
                       labels: banner(512, 825, 560, 132, "SUMMON", { c1: "#ff8ac8", c2: "#c93a8f" }) },
    AuroraGryphon: { bg: ["#ffe0f6", "#ff72c6", "#7a2486"], back: auroraBands(), hero: [512, 470, 760],
                     glow: [512, 455, 370], floor: [512, 695, 240, 40],
                     labels: banner(512, 825, 610, 132, "EXCLUSIVE", { c1: "#b48cff", c2: "#5b3ee0", size: 86 }),
                     sparkles: [[110, 250, 26], [920, 240, 24], [130, 600, 30], [905, 640, 22], [250, 120, 18], [790, 110, 20]] },
  };

  function compose() {
    const d = D[id] || D.VIP;
    const [hx, hy, hs, hr] = d.hero;
    let c = burst(d.bg);
    c += d.back || "";
    c += glow(d.glow[0], d.glow[1], d.glow[2]);
    c += sparkles(d.sparkles || SPARKS);
    if (d.floor) c += floorShadow(...d.floor);
    c += hero(id, hx, hy, hs, hr || 0);
    c += d.labels || "";
    return c;
  }

  document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${SIZE}" height="${SIZE}" viewBox="0 0 1024 1024">${baseDefs()}${compose()}</svg>`;
</script>
</body>
</html>
