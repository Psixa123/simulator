<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Thumbnail 3 (1920 x 1080): "BATTLE MEGA STORMS!" - a real Mega Storm (the Cosmic Maelstrom, built by
  WeatherModels.BuildMegaStorm) raging in the Storm Station arena, the storm-darkened sky around it, and the six
  exclusive pets the Mega Storms drop (GameConfig.MegaStorm: Tempest Twister, Thunder Titan, Blizzard Behemoth,
  Inferno Cyclone, Cosmic Maelstrom and the Rainbow Hurricane). Renders: tools/branding/capture.py.
-->
<link rel="stylesheet" href="branding/brand.css">
<style>
  #stage { width: 1920px; height: 1080px; }
  .storm-sky {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(38, 18, 104, 0.92) 0%, rgba(84, 40, 170, 0.7) 28%, rgba(120, 70, 220, 0.25) 50%, rgba(120, 70, 220, 0) 62%);
  }
  /* the storm darkens everything around it, and lights up pink inside */
  .storm-dark {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse 560px 520px at 50% 64%, rgba(30, 14, 80, 0) 0%, rgba(30, 14, 80, 0) 45%, rgba(30, 14, 80, 0.5) 100%);
  }
  .storm-glow {
    position: absolute;
    left: 660px;
    top: 420px;
    width: 600px;
    height: 560px;
    background: radial-gradient(ellipse, rgba(255, 80, 230, 0.9) 0%, rgba(160, 60, 255, 0.5) 50%, rgba(160, 60, 255, 0) 72%);
    mix-blend-mode: overlay;
  }
  .ground-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(35, 30, 102, 0.6) 0%, rgba(35, 30, 102, 0) 32%);
  }
</style>
<script src="branding/brand.js"></script>
</head>
<body>
<div id="stage">
  <img class="backdrop" decoding="sync" src="branding/map/arena.jpg" style="filter: saturate(1.6) contrast(1.2) brightness(0.95)">
  <div class="storm-sky"></div>
  <div class="storm-dark"></div>
  <div class="storm-glow"></div>
  <div class="sunburst" style="--x: 50%; --y: 48%; --ray: 0.08; --reach: 60%"></div>
  <div class="ground-shade"></div>
  <div class="vignette"></div>
</div>
<script>
const stage = document.getElementById("stage");
const ART = "branding/";
const glow = "rgba(255, 236, 120, 0.95)";

// The Mega Storm banner's health bar (HudController's storm banner), drawn big: the storm's name over a
// glass track with the remaining health
function healthBar(name, fraction, width = 560) {
  const height = 64;
  const outline = 7;
  const fill = (width - 16) * fraction;
  const wrapper = document.createElement("div");
  wrapper.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${width + outline * 2}" height="${height + 92}" overflow="visible">
    <defs>
      <linearGradient id="hp" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffb3f0"/><stop offset="0.5" stop-color="#ff5ad2"/><stop offset="1" stop-color="#c23ad8"/>
      </linearGradient>
    </defs>
    <text x="${width / 2 + outline}" y="56" text-anchor="middle" font-family="Luckiest Guy" font-size="52" letter-spacing="2"
      fill="#ffffff" stroke="${Brand.INK}" stroke-width="12" stroke-linejoin="round" paint-order="stroke">${name}</text>
    <g transform="translate(${outline} 80)">
      <rect width="${width}" height="${height}" rx="${height / 2}" fill="#d5e5fb" stroke="${Brand.INK}" stroke-width="${outline}"/>
      <rect x="8" y="8" width="${fill}" height="${height - 16}" rx="${(height - 16) / 2}" fill="url(#hp)"/>
      <rect x="22" y="13" width="${fill - 28}" height="12" rx="6" fill="#ffffff" opacity="0.55"/>
    </g>
  </svg>`;
  return wrapper.firstChild;
}

async function build() {
  await Brand.ready();

  // lightning around the storm
  Brand.place(stage, Brand.bolt(250, { glow }), [545, 520], { rotate: 20 });
  Brand.place(stage, Brand.bolt(290, { glow }), [1385, 520], { rotate: -16 });
  Brand.place(stage, Brand.bolt(150, { glow }), [300, 330], { rotate: -10 });
  Brand.place(stage, Brand.bolt(170, { glow }), [1640, 330], { rotate: 14 });

  // the six Mega Storm exclusives, three on each side
  const pets = [
    ["TempestTitan_three4", 290, [290, 630], -6],
    ["FrostColossus_three4", 270, [205, 880], -8],
    ["VoltWyrm_three4", 280, [460, 870], -4],
    ["MaelstromSpirit_three4", 290, [1630, 630], 6],
    ["RainbowRoc_three4", 280, [1715, 880], 8],
    ["CycloneDrake_three4", 280, [1460, 870], 4],
  ];
  for (const [pet, fit, at, rotate] of pets) {
    Brand.place(stage, Brand.sprite(ART + `pets/${pet}.png`, { fit }), at, { rotate });
  }
  Brand.place(stage, healthBar("COSMIC MAELSTROM", 0.62, 520), [960, 392]);
  Brand.place(stage, Brand.ribbon("WIN EXCLUSIVE PETS!", { size: 56, colors: "coral", padX: 46 }), [960, 985], { rotate: -1 });

  for (const [x, y, s] of [[690, 660, 42], [1240, 640, 38], [80, 520, 38], [1840, 520, 40]]) {
    Brand.place(stage, Brand.sparkle(s), [x, y]);
  }

  // title
  Brand.place(stage, Brand.ribbon("BATTLE", { size: 64, colors: "storm", padX: 50 }), [960, 72], { rotate: -2 });
  Brand.place(stage, Brand.title("MEGA STORMS!", { size: 200, maxWidth: 1500, fill: "bolt" }), [960, 230]);

  await Brand.imagesLoaded();
}

build();
</script>
</body>
</html>
