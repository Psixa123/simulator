<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Game icon (Roblox shows it small, often ~150 px): designed on a 1024 x 1024 grid, rendered at ?size=512 and
  ?size=1024 by tools/render_art.py. Real game art only: the Aurora Gryphon Stormling under a Storm Cloud
  weather cell (WeatherModels), both rendered by tools/branding/capture.py into assets/source/branding, on a
  stormy sunset sky whose warm middle makes the blue pet stand out.
  ?v=word adds a "STORM CATCHER" wordmark (readable at 150 px, but it covers the pet; not used).
-->
<link rel="stylesheet" href="branding/brand.css">
<style>
  #stage { width: 1024px; height: 1024px; }
  .sky {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 60%, #fffbe0 0%, #ffe07a 16%, #ffab5c 32%, #ff7a8a 50%, #a45be6 72%, #4b32b8 100%);
  }
</style>
<script src="branding/brand.js"></script>
</head>
<body>
<div id="stage">
  <div class="sky"></div>
  <div class="sunburst" style="--x: 50%; --y: 58%; --ray: 0.22; --reach: 80%"></div>
</div>
<script>
const params = new URLSearchParams(location.search);
const size = Number(params.get("size") || 512);
const withWordmark = params.get("v") === "word";
const stage = document.getElementById("stage");
stage.style.transform = `scale(${size / 1024})`;
document.body.style.width = `${size}px`;
document.body.style.height = `${size}px`;

const ART = "branding/";
const glow = "rgba(255, 236, 120, 0.9)";

async function build() {
  await Brand.ready();

  // bolts either side of the storm cloud, which hangs over the Aurora Gryphon (its own bolt hides behind the head)
  Brand.place(stage, Brand.bolt(290, { glow }), [140, 360], { rotate: -16 });
  Brand.place(stage, Brand.bolt(250, { glow }), [890, 330], { rotate: 18 });
  const cloud = Brand.place(stage, Brand.sprite(ART + "studio/Weather_StormCloud.png", { width: 560 }), [512, 318]);
  cloud.style.filter = `brightness(1.35) saturate(1.2) ${getComputedStyle(cloud).filter}`; // lifted out of the dark sky

  // two banks of clouds along the bottom: lilac behind, white in front
  const backBank = [[40, 190, 110], [190, 150, 100], [830, 140, 105], [990, 180, 115]];
  const frontBank = [[20, 300, 110], [170, 270, 100], [330, 300, 95], [690, 300, 95], [850, 265, 105], [1010, 290, 110]];
  Brand.place(stage, Brand.cloudBank(1024, 420, backBank, { top: "#f4eeff", bottom: "#c9b8ff" }), [512, 1024], { anchor: [0.5, 1] });
  Brand.place(stage, Brand.cloudBank(1024, 420, frontBank, { base: 330, bottom: "#b9d4ff" }), [512, 1024], { anchor: [0.5, 1] });

  // the Aurora Gryphon, big, with a warm halo that separates it from the sky
  const gryphon = Brand.place(stage, Brand.sprite(ART + "pets/AuroraGryphon_front.png", { width: 900 }),
    [512, withWordmark ? 640 : 680], { rotate: -4 });
  gryphon.style.filter = `drop-shadow(0 0 24px rgba(255, 250, 220, 0.9)) ${getComputedStyle(gryphon).filter}`;

  for (const [x, y, s] of [[110, 640, 64], [915, 620, 56], [290, 110, 40], [770, 100, 44]]) {
    Brand.place(stage, Brand.sparkle(s), [x, y]);
  }
  if (withWordmark) {
    Brand.place(stage, Brand.title("STORM CATCHER", { size: 150, maxWidth: 940, fill: "bolt" }), [512, 905]);
  }
  await Brand.imagesLoaded();
}

build();
</script>
</body>
</html>
