<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Roblox Ads Manager image creatives (16:9, 1920 x 1080), one per hook for A/B testing:
  ads.html?id=catch | hatch | mega | islands | tiers | legendary | scene | title
  tools/render_art.py renders them all with `python3 tools/render_art.py ads` into assets/ads/ad_0N_<id>.png.

  They are seen small in the Home feed (about 300 - 400 px wide), so each has one focal subject, at most about
  four big words and its content inside 6 % margins (115 px left/right, 65 px top/bottom). Everything shown is
  real game content rendered by tools/branding/capture.py (assets/source/branding): the map, weather cells, eggs,
  pets, and a blocky player with the Storm Vacuum and Storm Tank built by the game's CharacterGear.
-->
<link rel="stylesheet" href="branding/brand.css">
<style>
  #stage { width: 1920px; height: 1080px; }
  .fill {
    position: absolute;
    inset: 0;
  }
  /* a soft round light (set left / top / width / height and --color) */
  .halo {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle, var(--color, rgba(255, 255, 255, 0.9)) 0%, transparent 68%);
    transform: translate(-50%, -50%);
  }
</style>
<script src="branding/brand.js"></script>
</head>
<body>
<div id="stage"></div>
<script>
const stage = document.getElementById("stage");
const ART = "branding/";
const INK = Brand.INK;
const BOLT_GLOW = "rgba(255, 236, 120, 0.95)";

// ------------------------------------------------------------------------------------------- helpers

// A full-size layer: a map render (with a CSS filter), a gradient, or the light rays
function backdrop(src, filter = "") {
  const image = document.createElement("img");
  image.className = "backdrop";
  image.decoding = "sync";
  image.src = ART + src;
  if (filter) image.style.filter = filter;
  stage.appendChild(image);
  return image;
}

function layer(css) {
  const div = document.createElement("div");
  div.className = "fill";
  div.style.cssText += css;
  stage.appendChild(div);
  return div;
}

function rays(x, y, strength = 0.18, reach = "70%") {
  const div = document.createElement("div");
  div.className = "sunburst";
  div.style.cssText = `--x: ${x}; --y: ${y}; --ray: ${strength}; --reach: ${reach}`;
  stage.appendChild(div);
}

function halo(x, y, size, color) {
  const div = document.createElement("div");
  div.className = "halo";
  div.style.cssText = `left: ${x}px; top: ${y}px; width: ${size}px; height: ${size * 0.8}px; --color: ${color}`;
  stage.appendChild(div);
}

function pet(name, fit, at, opts = {}) {
  return Brand.place(stage, Brand.sprite(ART + `pets/${name}.png`, { fit }), at, opts);
}

function studio(name, width, at, opts = {}) {
  return Brand.place(stage, Brand.sprite(ART + `studio/${name}.png`, { width }), at, opts);
}

function sparkles(list) {
  for (const [x, y, size] of list) {
    Brand.place(stage, Brand.sparkle(size), [x, y]);
  }
}

// The vacuum's suction (EffectsController's VacuumBeam): from the nozzle (narrow) to the weather cell (wide),
// light blue fading into the cell's accent colour, with swirling streaks and sparkles drawn into the nozzle
function suction(from, to, startWidth, endWidth, accent) {
  const [x1, y1] = from;
  const [x2, y2] = to;
  const length = Math.hypot(x2 - x1, y2 - y1);
  const angle = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
  const half = (t) => (startWidth + (endWidth - startWidth) * t) / 2;
  let streaks = "";
  for (let i = 0; i < 3; i++) {
    let d = "";
    for (let t = 0; t <= 1.0001; t += 0.02) {
      const y = Math.sin(t * Math.PI * 2.6 + i * 2.1) * half(t) * 0.75;
      d += `${t === 0 ? "M" : "L"} ${(t * length).toFixed(1)} ${y.toFixed(1)} `;
    }
    streaks += `<path d="${d}" fill="none" stroke="#ffffff" stroke-width="${9 - i * 2}" stroke-linecap="round" opacity="${0.8 - i * 0.15}"/>`;
  }
  let specks = "";
  for (let i = 0; i < 22; i++) {
    const t = (i * 0.37) % 1;
    const y = Math.sin(i * 2.7) * half(t) * 0.8;
    const r = 5 + 9 * t;
    specks += `<circle cx="${t * length}" cy="${y}" r="${r}" fill="#ffffff" opacity="0.9"/>`;
  }
  const wrapper = document.createElement("div");
  wrapper.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
    <defs>
      <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#f2fdff" stop-opacity="1"/>
        <stop offset="0.6" stop-color="#9fe8ff" stop-opacity="0.9"/>
        <stop offset="1" stop-color="${accent}" stop-opacity="0.7"/>
      </linearGradient>
      <filter id="soft" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
    </defs>
    <g transform="translate(${x1} ${y1}) rotate(${angle})">
      <path d="M 0 ${-startWidth * 0.7} L ${length} ${-endWidth * 0.7} L ${length} ${endWidth * 0.7} L 0 ${startWidth * 0.7} Z"
        fill="#7fe6ff" opacity="0.9" filter="url(#soft)"/>
      <path d="M 0 ${-startWidth / 2} L ${length} ${-endWidth / 2} L ${length} ${endWidth / 2} L 0 ${startWidth / 2} Z" fill="url(#beam)"/>
      <path d="M 0 ${-startWidth / 5} L ${length} ${-endWidth / 5} L ${length} ${endWidth / 5} L 0 ${startWidth / 5} Z"
        fill="#ffffff" opacity="0.55" filter="url(#soft)"/>
      ${streaks}${specks}
    </g>
  </svg>`;
  const svg = wrapper.firstChild;
  svg.classList.add("layer");
  svg.style.left = "0px";
  svg.style.top = "0px";
  stage.appendChild(svg);
  return svg;
}

// One half of an egg render broken along the hatch animation's crack belt (Hatch.luau CRACKS, stage 3: egg
// units, x = half widths, y = half heights, down is +), with an Ink edge along the break. Returns a <canvas>.
const BELT = [[-1.2, 0.02], [-0.86, 0.02], [-0.66, -0.09], [-0.46, 0.04], [-0.28, -0.08], [-0.1, 0.04], [0.06, -0.09],
  [0.24, 0.03], [0.44, -0.09], [0.64, 0.03], [0.86, -0.05], [1.2, -0.05]];

async function eggHalf(src, part, width) {
  const image = await Brand.loadImage(src);
  const w = image.naturalWidth;
  const h = image.naturalHeight;
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  canvas.style.width = `${width}px`;
  canvas.style.height = `${width * h / w}px`;
  canvas.className = "sprite";
  const context = canvas.getContext("2d");
  // the sticker render: the egg fills it apart from a ~4 % border (outline + margin)
  const point = ([x, y]) => [w / 2 + x * w * 0.46, h / 2 + y * h * 0.46];
  context.beginPath();
  BELT.forEach((p, index) => (index ? context.lineTo(...point(p)) : context.moveTo(...point(p))));
  const edgeY = part === "top" ? 0 : h;
  context.lineTo(w, edgeY);
  context.lineTo(0, edgeY);
  context.closePath();
  context.save();
  context.clip();
  context.drawImage(image, 0, 0);
  context.restore();
  // the Ink edge of the break, only where there is shell
  context.globalCompositeOperation = "source-atop";
  context.beginPath();
  BELT.forEach((p, index) => (index ? context.lineTo(...point(p)) : context.moveTo(...point(p))));
  context.strokeStyle = INK;
  context.lineWidth = w * 0.035;
  context.lineJoin = "round";
  context.stroke();
  return canvas;
}

// Arrow for the crafting steps, with a "5x" badge
function craftArrow(label) {
  const wrapper = document.createElement("div");
  wrapper.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="190" height="200" viewBox="0 0 190 200" overflow="visible">
    <path d="M 20 70 L 105 70 L 105 30 L 175 100 L 105 170 L 105 130 L 20 130 Z" fill="#ffffff" stroke="${INK}"
      stroke-width="12" stroke-linejoin="round"/>
    <text x="80" y="118" text-anchor="middle" font-family="Luckiest Guy" font-size="46" fill="${INK}">${label}</text>
  </svg>`;
  return wrapper.firstChild;
}

// The Mega Storm banner's health bar (HudController), drawn big: the storm's name over a glass track
function healthBar(name, fraction, width) {
  const height = 70;
  const outline = 8;
  const fill = (width - 18) * fraction;
  const wrapper = document.createElement("div");
  wrapper.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${width + outline * 2}" height="${height + 100}" overflow="visible">
    <defs>
      <linearGradient id="hp" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffb3f0"/><stop offset="0.5" stop-color="#ff5ad2"/><stop offset="1" stop-color="#c23ad8"/>
      </linearGradient>
    </defs>
    <text x="${width / 2 + outline}" y="62" text-anchor="middle" font-family="Luckiest Guy" font-size="58" letter-spacing="2"
      fill="#ffffff" stroke="${INK}" stroke-width="13" stroke-linejoin="round" paint-order="stroke">${name}</text>
    <g transform="translate(${outline} 90)">
      <rect width="${width}" height="${height}" rx="${height / 2}" fill="#d5e5fb" stroke="${INK}" stroke-width="${outline}"/>
      <rect x="9" y="9" width="${fill}" height="${height - 18}" rx="${(height - 18) / 2}" fill="url(#hp)"/>
      <rect x="24" y="15" width="${fill - 30}" height="13" rx="6.5" fill="#ffffff" opacity="0.55"/>
    </g>
  </svg>`;
  return wrapper.firstChild;
}

// The vacuum scene of ads 1 and 7: the player (from behind, anchored by the bottom-left corner of the sprite)
// aims the Storm Vacuum at a weather cell `reach` px away along the barrel, which points 15 degrees up. The
// suction beam runs behind the cell into its body (the upper part of the sprite: the cells' bolts hang below).
const PLAYER_SIZE = [711, 717]; // studio/Gear_Player.png
const PLAYER_NOZZLE = [650, 105]; // its vacuum's mouth
const AIM_ANGLE = 15 * Math.PI / 180;

function vacuumScene({ player, reach, cloud, cloudWidth, accent, beamWidths, brighten = 1 }) {
  const sprite = Brand.sprite(ART + "studio/Gear_Player.png", { width: player.width });
  Brand.place(stage, sprite, player.at, { anchor: [0, 1], z: 3 });
  const scale = player.width / PLAYER_SIZE[0];
  const nozzle = [player.at[0] + PLAYER_NOZZLE[0] * scale, player.at[1] - (PLAYER_SIZE[1] - PLAYER_NOZZLE[1]) * scale];
  const body = [nozzle[0] + Math.cos(AIM_ANGLE) * reach, nozzle[1] - Math.sin(AIM_ANGLE) * reach];
  const cloudAt = [body[0] + cloudWidth * 0.05, body[1] + cloudWidth * 0.17];
  halo(body[0], body[1], cloudWidth * 1.5, "rgba(190, 240, 255, 0.6)");
  const cell = studio(cloud, cloudWidth, cloudAt, { z: 2 });
  if (brighten !== 1) cell.style.filter = `brightness(${brighten}) ${getComputedStyle(cell).filter}`;
  const beam = suction(nozzle, body, beamWidths[0], beamWidths[1], accent);
  beam.style.zIndex = 1;
  return { nozzle, body, cell };
}

    Brand.place(stage, Brand.bolt(230, { glow: BOLT_GLOW }), [1770, 250], { rotate: 16 });

    Brand.place(stage, Brand.title("STORM!", { size: 230, fill: "bolt" }), [130, 255], { anchor: [0, 0], z: 6 });

    layer("background: radial-gradient(ellipse 520px 480px at 50% 64%, rgba(255, 80, 230, 0.75), rgba(160, 60, 255, 0.35) 50%, transparent 72%); mix-blend-mode: overlay");
    Brand.place(stage, Brand.bolt(280, { glow: BOLT_GLOW }), [470, 560], { rotate: 18 });
    Brand.place(stage, Brand.bolt(300, { glow: BOLT_GLOW }), [1450, 560], { rotate: -16 });
    pet("MaelstromSpirit_three4", 360, [1560, 880], { rotate: 6, z: 3 });

  },

  },

  async legendary() {

    rays("50%", "66%", 0.26, "85%");
    halo(960, 720, 900, "rgba(255, 245, 190, 0.95)");
    const gold = "rgba(255, 214, 80, 0.95)";
    const legends = [["StormLord", 300, [590, 670], -8, 2], ["GalaxyGuardian", 300, [1330, 660], 8, 2],
      ["YetiKing", 370, [320, 865], -6, 3], ["InfernoDrake", 370, [1600, 865], 6, 3], ["BreezeKing", 630, [960, 805], 0, 4]];
    for (const [name, fit, at, rotate, z] of legends) {

    Brand.place(stage, Brand.title("LEGENDARY", { size: 190, maxWidth: 1560, fill: "bolt" }), [960, 160], { z: 6 });
    Brand.place(stage, Brand.title("PETS!", { size: 160, fill: "cloud" }), [960, 330], { z: 6 });
  },

  // 7. No text: the vacuum scene big, a purple Thunderhead, pets watching
  async scene() {
    backdrop("map/thunder_field.jpg", "blur(4px) saturate(1.35) brightness(1.08)");
    layer("background: linear-gradient(180deg, rgba(60, 30, 150, 0.45) 0%, rgba(60, 30, 150, 0) 50%)");

    rays("50%", "72%", 0.24, "85%");

    sparkles([[300, 560, 56], [1620, 540, 50], [470, 440, 36], [1450, 430, 40]]);
    Brand.place(stage, Brand.title("STORM CATCHER", { size: 200, maxWidth: 1560, fill: "bolt" }), [960, 160], { z: 6 });
    Brand.place(stage, Brand.ribbon("SIMULATOR", { size: 70, colors: "sky", padX: 64 }), [960, 318], { rotate: -2, z: 6 });

};

async function build() {
  await Brand.ready();
  const id = new URLSearchParams(location.search).get("id") || "catch";
  await ADS[id]();
  await Brand.imagesLoaded();
}

build();
</script>
</body>
