<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: "Luckiest Guy"; src: url("fonts/LuckiestGuy-Regular.ttf"); }
  @font-face { font-family: "Fredoka One"; src: url("fonts/FredokaOne-Regular.ttf"); }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  svg { display: block; }
</style>
<script src="art.js"></script>
</head>
<body>
<script>
  // Gamepass and developer product icons (512x512, designed on a 1024 grid).
  // Roblox shows pass icons cropped to a circle, so everything important stays inside
  // a centered circle of radius ~430.
  //   badge.html?id=VIP   -> one icon (ids match Monetization.luau keys)
  const id = new URLSearchParams(location.search).get("id") || "VIP";
  const SIZE = 512;

  // ------------------------------------------------------------- designs
  const D = {};

  D.VIP = () => ({
    bg: ["#ffe27a", "#ffae1e", "#b85a00"],
    art: crown(512, 470, 1.25) + tag(512, 820, "VIP", 190, { colors: ["#ffffff", "#fff3b0", "#ffd23c"] }),
    sparkles: true,
  });

  D.DoubleVolts = () => ({
    bg: ["#fff07a", "#ffbe2e", "#c46a00"],
    art: coinStack(400, 690, 5, 150) + coinFront(640, 430, 150) + tag(330, 330, "2X", 230, { rot: -10 }),
    sparkles: true,
  });

  D.DoubleEnergy = () => ({
    bg: ["#9ff0ff", "#3ab8f5", "#174f9c"],
    art: bolt(520, 180, 3.4, 8) + tag(300, 330, "2X", 230, { rot: -10 }),
    sparkles: true,
  });

  D.AutoCatch = () => ({
    bg: ["#b8ffcf", "#4fd28a", "#1c7a4a"],
    art:
      cloud(820, 230, 0.8, "#ffffff", "#cfe0ff") +
      beam(735, 395, 840, 250, 50, 130) +
      vacuum(380, 590, 2.6, -28) +
      ribbon(512, 830, 470, 130, "AUTO", { size: 100, c1: "#58d5ff", c2: "#2b86e6", rot: -3 }),
  });

  D.RemoteSell = () => ({
    bg: ["#ffd0a8", "#ff8c4a", "#b43c14"],
    art:
      coinStack(512, 640, 4, 170) +
      `<g fill="none" stroke-linecap="round">` +
      [150, 230, 310].map((r) => `<path d="M${512 - r * 0.7},${330 - r * 0.7 + 60} A${r},${r} 0 0 1 ${512 + r * 0.7},${330 - r * 0.7 + 60}" stroke="${INK}" stroke-width="56"/><path d="M${512 - r * 0.7},${330 - r * 0.7 + 60} A${r},${r} 0 0 1 ${512 + r * 0.7},${330 - r * 0.7 + 60}" stroke="#ffffff" stroke-width="30"/>`).join("") +
      `</g>` +
      ribbon(512, 840, 560, 130, "AUTO SELL", { size: 92, c1: "#ffd84a", c2: "#f09a1a", rot: -3 }),
  });

  D.MegaTank = () => ({
    bg: ["#b8c4ff", "#6c7cff", "#26308f"],
    art: tank(560, 520, 1.25, 0.85) + tag(270, 330, "2X", 230, { rot: -10 }),
    sparkles: true,
  });

  D.LuckyHatcher = () => ({
    bg: ["#d0ffb0", "#62d45a", "#1f7a34"],
    art: egg(450, 560, 2.4, "#ffffff", "#bfe6ff", -8) + clover(700, 330, 1.45, 15),
    sparkles: true,
  });

  D.TripleHatch = () => ({
    bg: ["#ffd0ec", "#ff8ac8", "#a8357a"],
    art:
      egg(270, 600, 1.75, "#96e66e", "#fff08c", -14) +
      egg(754, 600, 1.75, "#7ec8ff", "#e0f4ff", 14) +
      egg(512, 520, 2.1, "#ffd23c", "#fff6c0", 0) +
      tag(512, 900, "X3", 190),
  });

  D.AutoHatch = () => ({
    bg: ["#e2c8ff", "#a678ff", "#4a2a9c"],
    art: loopArrows(512, 512, 330) + egg(512, 530, 2.0, "#ff8ac8", "#ffe0f2", 0),
    sparkles: true,
  });

  D.PetSlots = () => ({
    bg: ["#ffc4d6", "#ff6f9a", "#a82a52"],
    art:
      pet(280, 560, 1.7, { body: "cloud", color: "#ffffff", accent: "#bfe6ff" }) +
      pet(744, 560, 1.7, { body: "bean", color: "#ffe14a", accent: "#fff9d0", features: ["bunny"] }) +
      pet(512, 470, 2.1, { body: "round", color: "#7ec8ff", accent: "#ffd23c", features: ["ears"] }) +
      tag(512, 880, "+3 SLOTS", 140),
  });

  D.StormRadar = () => ({
    bg: ["#b0fff0", "#38c9b0", "#0f5a62"],
    art:
      radar(512, 470, 1.25) +
      `<g transform="translate(640,330)"><circle r="34" fill="#ff4d7a" stroke="${INK}" stroke-width="10"/><circle r="64" fill="none" stroke="#ff4d7a" stroke-width="8" opacity="0.6"/></g>` +
      `<g transform="translate(390,560)"><circle r="22" fill="#ffd23c" stroke="${INK}" stroke-width="8"/></g>` +
      ribbon(512, 870, 560, 130, "RADAR", { size: 100, c1: "#ff7ac0", c2: "#c93a8f", rot: -3 }),
  });

  D.VoltsSmall = () => ({
    bg: ["#fff07a", "#ffbe2e", "#c46a00"],
    art: coinFront(512, 500, 230),
    sparkles: true,
  });

  D.VoltsMedium = () => ({
    bg: ["#fff07a", "#ffbe2e", "#c46a00"],
    art: coinStack(400, 700, 4, 160) + coinStack(640, 740, 3, 150) + coinFront(560, 380, 140),
    sparkles: true,
  });

  D.VoltsLarge = () => ({
    bg: ["#fff07a", "#ffa62e", "#b85000"],
    art:
      coinStack(330, 470, 3, 120) + coinStack(690, 450, 4, 120) + coinStack(512, 420, 3, 130) +
      treasure(512, 640, 1.25) +
      coinFront(300, 820, 90) + coinFront(740, 830, 100),
    sparkles: true,
  });

  D.VoltsHuge = () => {
    let art = "";
    const stacks = [[250, 780, 5], [420, 820, 7], [604, 820, 8], [780, 780, 6], [340, 600, 6], [690, 610, 7], [512, 560, 9]];
    for (const [x, y, n] of stacks) art += coinStack(x, y, n, 115);
    art += coinFront(512, 300, 150);
    art += bolt(170, 200, 1.2, -16) + bolt(820, 220, 1.1, 14);
    return { bg: ["#fff3a0", "#ffb21e", "#a84600"], art, sparkles: true };
  };

  D.EnergyBoost = () => ({
    bg: ["#9ff0ff", "#3ab8f5", "#174f9c"],
    art: bolt(560, 190, 3.1, 8) + tag(300, 320, "2X", 220, { rot: -10 }) + ribbon(512, 860, 460, 120, "30 MIN", { size: 92, c1: "#ffd84a", c2: "#f09a1a", rot: -3 }),
    sparkles: true,
  });

  D.LuckBoost = () => ({
    bg: ["#d0ffb0", "#62d45a", "#1f7a34"],
    art: clover(560, 470, 2.0, 10) + tag(290, 320, "2X", 220, { rot: -10 }) + ribbon(512, 860, 460, 120, "30 MIN", { size: 92, c1: "#ffd84a", c2: "#f09a1a", rot: -3 }),
    sparkles: true,
  });

  D.SummonMegaStorm = () => ({
    bg: ["#d4a8ff", "#7c3aed", "#2a0e6a"],
    art:
      `<g opacity="0.6">` + cloud(512, 170, 2.6, "#8a6be8", "#6c50d0", null) + `</g>` +
      tornado(520, 200, 1.55, { bands: 9, step: 52, dark: "#5b2bd4", light: "#f4e6ff", mid: "#b78cff", phase: 2.0 }) +
      bolt(180, 300, 1.35, -14) + bolt(800, 340, 1.2, 14) +
      ribbon(512, 870, 540, 130, "SUMMON", { size: 100, c1: "#ff7ac0", c2: "#c93a8f", rot: -3 }),
  });

  // ------------------------------------------------------------- compose
  const design = (D[id] || D.VIP)();
  let c = "";
  c += sky(1024, 1024, design.bg, 0.5, 0.4);
  c += rays(512, 470, 900, 18, "#ffffff", 0.12);
  // soft inner vignette so the art pops inside the circular crop
  const vignette = rad([[0, "#000000", 0], [0.72, "#000000", 0], [1, "#000000", 0.35]], 0.5, 0.5, 0.72);
  c += `<defs>${vignette.def}</defs>`;
  c += design.art;
  if (design.sparkles) {
    for (const [x, y, r] of [[170, 520, 30], [860, 600, 26], [240, 200, 22], [820, 160, 28], [150, 780, 20], [880, 820, 22]]) {
      c += sparkle(x, y, r, "#ffffff", 0.95);
    }
  }
  c += `<rect width="1024" height="1024" fill="${vignette.url}"/>`;

  document.body.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${SIZE}" height="${SIZE}" viewBox="0 0 1024 1024">${baseDefs()}${c}</svg>`;
</script>
</body>
</html>
