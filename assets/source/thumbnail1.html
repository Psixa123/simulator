<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Thumbnail 1 (1920 x 1080): the title over the real world - the Storm Station hub and the six zone
  islands in a row over the cloud sea (a Mega Storm in the hub's arena, weather cells in every field) -
  with real weather cells around it and a crowd of Stormlings in front. Renders: tools/branding/capture.py.
  Everything that matters stays inside the middle 1600 x 1000 (Roblox crops thumbnails in some places).
-->
<link rel="stylesheet" href="branding/brand.css">
<style>
  #stage { width: 1920px; height: 1080px; }
  .sky-wash {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(47, 134, 242, 0.75) 0%, rgba(92, 200, 255, 0.35) 26%, rgba(92, 200, 255, 0) 46%);
  }
  .ground-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(35, 48, 102, 0.55) 0%, rgba(35, 48, 102, 0) 34%);
  }
</style>
<script src="branding/brand.js"></script>
</head>
<body>
<div id="stage">
  <img class="backdrop" src="branding/map/islands.jpg">
  <div class="sky-wash"></div>
  <div class="sunburst" style="--x: 50%; --y: 30%; --ray: 0.12; --reach: 60%"></div>
  <div class="ground-shade"></div>
  <div class="vignette"></div>
</div>
<script>
const stage = document.getElementById("stage");
const ART = "branding/";
const glow = "rgba(255, 236, 120, 0.9)";

async function build() {
  await Brand.ready();

  // weather cells around the islands (real WeatherModels)
  Brand.place(stage, Brand.sprite(ART + "studio/Weather_StormCloud.png", { width: 360 }), [250, 520], { rotate: -6 });
  Brand.place(stage, Brand.sprite(ART + "studio/Weather_FireTornado.png", { width: 170 }), [470, 700], { rotate: 8 });
  Brand.place(stage, Brand.sprite(ART + "studio/Weather_RainbowMist.png", { width: 320 }), [1680, 500], { rotate: 6 });
  Brand.place(stage, Brand.sprite(ART + "studio/Weather_SnowCloud.png", { width: 220 }), [1450, 680], { rotate: -4 });
  Brand.place(stage, Brand.bolt(150, { glow }), [90, 380], { rotate: -18 });
  Brand.place(stage, Brand.bolt(120, { glow }), [1840, 360], { rotate: 18 });

  // the Stormlings: the Aurora Gryphon in the middle, friends from every zone around it
  const pets = [
    ["Zappy", 190, [770, 790], -4],
    ["Nebula", 210, [1160, 790], 4],
    ["BreezeKing", 290, [420, 905], -6],
    ["ThunderPup", 280, [680, 935], -3],
    ["PhoenixChick", 270, [1250, 940], 3],
    ["AuroraFox", 290, [1510, 905], 6],
    ["AuroraGryphon", 470, [960, 880], 0],
  ];
  for (const [pet, width, at, rotate] of pets) {
    Brand.place(stage, Brand.sprite(ART + `pets/${pet}.png`, { width }), at, { rotate });
  }
  for (const [x, y, s] of [[600, 560, 50], [1330, 600, 44], [180, 760, 40], [1760, 760, 46], [960, 640, 36]]) {
    Brand.place(stage, Brand.sparkle(s), [x, y]);
  }

  // title
  Brand.place(stage, Brand.title("STORM CATCHER", { size: 200, maxWidth: 1480, fill: "bolt" }), [960, 160]);
  Brand.place(stage, Brand.ribbon("SIMULATOR", { size: 74, colors: "sky", padX: 70 }), [960, 318], { rotate: -2 });

  await Brand.imagesLoaded();
}

build();
</script>
</body>
</html>
