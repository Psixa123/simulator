<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Thumbnail 1 (1920 x 1080): the title over the real world - the Storm Station hub and the six zone
  islands in a row over the cloud sea (a Mega Storm in the hub's arena, weather cells in every field) -
  with real weather cells around it and a crowd of Stormlings in front. Renders: tools/branding/capture.py.
  Everything that matters stays inside the middle 1600 x 1000 (Roblox crops thumbnails in some places).
-->
<link rel="stylesheet" href="branding/brand.css">
<style>
  #stage { width: 1920px; height: 1080px; }
  .sky-wash {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(47, 134, 242, 0.75) 0%, rgba(92, 200, 255, 0.35) 26%, rgba(92, 200, 255, 0) 46%);
  }
  .ground-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(35, 48, 102, 0.55) 0%, rgba(35, 48, 102, 0) 34%);
  }
</style>
<script src="branding/brand.js"></script>
</head>
<body>
<div id="stage">
  <img class="backdrop" decoding="sync" src="branding/map/islands.jpg" style="filter: saturate(1.55) contrast(1.18) brightness(1.02)">
  <div class="sky-wash"></div>
  <div class="sunburst" style="--x: 50%; --y: 30%; --ray: 0.12; --reach: 60%"></div>
  <div class="ground-shade"></div>
  <div class="vignette"></div>
</div>
<script>
const stage = document.getElementById("stage");
const ART = "branding/";
const glow = "rgba(255, 236, 120, 0.9)";

async function build() {
  await Brand.ready();

  // weather cells around the islands (real WeatherModels)
  Brand.place(stage, Brand.sprite(ART + "studio/Weather_StormCloud.png", { width: 360 }), [255, 520], { rotate: -6 });
  Brand.glow(Brand.place(stage, Brand.sprite(ART + "studio/Weather_Starstorm.png", { width: 200 }), [490, 690], { rotate: 10 }),
    "rgba(255, 240, 150, 0.9)", 36);
  Brand.place(stage, Brand.sprite(ART + "studio/Weather_RainbowMist.png", { width: 330 }), [1665, 510], { rotate: 6 });
  Brand.glow(Brand.place(stage, Brand.sprite(ART + "studio/Weather_CosmicVortex.png", { width: 170 }), [1420, 690], { rotate: 8 }),
    "rgba(200, 120, 255, 0.7)", 30);
  Brand.place(stage, Brand.bolt(150, { glow }), [95, 390], { rotate: -18 });
  Brand.place(stage, Brand.bolt(120, { glow }), [1835, 370], { rotate: 18 });

  // the Stormlings: the Aurora Gryphon in the middle, friends from every zone around it
  const pets = [
    ["BreezeKing", 290, [395, 910], -6],
    ["ThunderPup", 270, [655, 950], -3],
    ["PhoenixChick", 260, [1270, 955], 3],
    ["AuroraFox", 290, [1530, 910], 6],
    ["AuroraGryphon", 560, [960, 880], 0],
  ];
  for (const [pet, width, at, rotate] of pets) {
    Brand.place(stage, Brand.sprite(ART + `pets/${pet}.png`, { width }), at, { rotate });
  }
  for (const [x, y, s] of [[640, 600, 50], [1300, 640, 44], [180, 770, 40], [1760, 770, 46]]) {
    Brand.place(stage, Brand.sparkle(s), [x, y]);
  }

  // title: the name, with the SIMULATOR ribbon tucked under it
  Brand.place(stage, Brand.title("STORM CATCHER", { size: 190, maxWidth: 1440, fill: "bolt" }), [960, 128]);
  Brand.place(stage, Brand.ribbon("SIMULATOR", { size: 58, colors: "sky", padX: 60 }), [960, 258], { rotate: -2 });

  await Brand.imagesLoaded();
}

build();
</script>
</body>
</html>
