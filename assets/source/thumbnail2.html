<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Thumbnail 2 (1920 x 1080): "COLLECT 38 STORMLING PETS!" - a crowd of real Stormlings in front of the six real
  eggs, with a Golden and a Rainbow pet (5 of a pet craft a Golden one, 5 Golden a Rainbow one), over Sunny
  Plains around its egg incubator. src/shared/Config/Pets.luau has 38 pets, but only 30 hatch from the six eggs
  (6 are Mega Storm exclusives, Sunbeam a daily reward, the Aurora Gryphon a shop pet), so the title says
  COLLECT 38, not HATCH 38. Renders: tools/branding/capture.py.
-->
<link rel="stylesheet" href="branding/brand.css">
<style>
  #stage { width: 1920px; height: 1080px; }
  .light {
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at 50% 62%, rgba(255, 255, 240, 0.85) 0%, rgba(255, 250, 220, 0.4) 30%, rgba(255, 255, 255, 0) 62%);
  }
  .sky-wash {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(47, 134, 242, 0.8) 0%, rgba(92, 200, 255, 0.35) 30%, rgba(92, 200, 255, 0) 50%);
  }
</style>
<script src="branding/brand.js"></script>
</head>
<body>
<div id="stage">
  <img class="backdrop" decoding="sync" src="branding/map/plains.jpg" style="filter: blur(5px) saturate(1.4) brightness(1.05)">
  <div class="sky-wash"></div>
  <div class="light"></div>
  <div class="sunburst" style="--x: 50%; --y: 62%; --ray: 0.3; --reach: 75%"></div>
  <div class="vignette"></div>
</div>
<script>
const stage = document.getElementById("stage");
const ART = "branding/";

async function build() {
  await Brand.ready();

  // the six eggs (zone order), in an arc behind the crowd
  const eggs = ["MeadowEgg", "ThunderEgg", "DuneEgg", "FrostEgg", "MagmaEgg", "CosmicEgg"];
  eggs.forEach((egg, index) => {
    const t = index / (eggs.length - 1) - 0.5;
    const x = 960 + t * 1500;
    const y = 470 + Math.abs(t) * 2 * 60 + (Math.abs(t) < 0.2 ? 20 : 0);
    Brand.place(stage, Brand.sprite(ART + `studio/Egg_${egg}.png`, { height: 210 }), [x, y], { rotate: t * 18 });
  });

  // back row: one pet from every egg
  const back = ["Droplet", "Zappy", "CactusCub", "Icicle", "LavaPup", "Nebula", "Sunny", "VoltBat", "Scarab", "Moonbeam", "Ember"];
  back.forEach((pet, index) => {
    const t = index / (back.length - 1) - 0.5;
    Brand.place(stage, Brand.sprite(ART + `pets/${pet}.png`, { fit: 190 }), [960 + t * 1560, 640 + Math.abs(t) * 40], { rotate: t * 14 });
  });

  // middle row: Legendaries at the sides
  const middle = [["BreezeKing", 215, 820], ["InfernoDrake", 1705, 820]];
  for (const [pet, x, y] of middle) {
    Brand.place(stage, Brand.sprite(ART + `pets/${pet}.png`, { fit: 240 }), [x, y], { rotate: (x - 960) / 120 });
  }

  // front: a Golden and a Rainbow pet around the Aurora Gryphon
  Brand.place(stage, Brand.sprite(ART + "pets/ThunderPup_Golden.png", { fit: 330 }), [470, 880], { rotate: -5 });
  Brand.place(stage, await Brand.rainbowSprite(ART + "pets/AuroraFox_Rainbow.png", { fit: 330 }), [1450, 880], { rotate: 5 });
  Brand.place(stage, Brand.sprite(ART + "pets/AuroraGryphon.png", { width: 540 }), [960, 870]);
  Brand.place(stage, Brand.ribbon("GOLDEN", { size: 46, colors: "bolt", padX: 34, textStroke: "#9a5a00" }), [470, 1010], { rotate: -4 });
  Brand.place(stage, Brand.ribbon("RAINBOW", { size: 46, colors: "storm", padX: 34 }), [1450, 1010], { rotate: 4 });

  for (const [x, y, s] of [[300, 760, 46], [1640, 760, 50], [700, 560, 40], [1230, 560, 40], [1300, 900, 38], [620, 900, 36]]) {
    Brand.place(stage, Brand.sparkle(s), [x, y]);
  }

  // title
  Brand.place(stage, Brand.title("COLLECT 38", { size: 190, maxWidth: 1300, fill: "bolt" }), [960, 122]);
  Brand.place(stage, Brand.title("STORMLING PETS!", { size: 130, maxWidth: 1400, fill: "cloud" }), [960, 285]);

  await Brand.imagesLoaded();
}

build();
</script>
</body>
</html>
