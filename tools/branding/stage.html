<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Branding Stage</title>
<!--
  Renders one model of the branding "studio" (tools/branding/BrandingScene.luau: a weather cell, an egg or a
  Mega Storm built by the game's own WeatherModels / EggModels code) on a transparent background, with the
  lights, glossy materials and ink outline of the Stormling previews (tools/pets/viewer.html), so these
  models sit next to the pet renders in the game page art. Used by tools/branding/capture.py.

  Query: ?parts=<url of a JSON list of parts>&size=1024&az=-20&el=14&fill=1
    parts  tools/preview_map.py's scene.json part rows, cut to one studio slot and moved to the origin:
           [shape, kind, opacity, castShadow, x, y, z, r00..r22, sx, sy, sz, "RRGGBB"]
    az/el  camera azimuth (degrees, 0 = in front: the -Z side) and elevation; fill = frame margin factor
  Serve the repo root over http (capture.py does) - three.js comes from tools/pets/node_modules.
-->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../pets/node_modules/three/build/three.module.js",
    "three/addons/": "../pets/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

const params = new URLSearchParams(location.search);
const size = Number(params.get('size') || 1024);
const azimuth = THREE.MathUtils.degToRad(Number(params.get('az') || -20));
const elevation = THREE.MathUtils.degToRad(Number(params.get('el') || 14));
const fillFactor = Number(params.get('fill') || 1);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.05;
document.body.appendChild(renderer.domElement);

// Same lights as tools/pets/viewer.html
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xeef6ff, 0xa898c0, 1.55));
const key = new THREE.DirectionalLight(0xfff4e6, 2.3);
key.position.set(-2.5, 4.5, -4);
scene.add(key);
const fill = new THREE.DirectionalLight(0xd8e6ff, 0.7);
fill.position.set(4, 1.5, -2.5);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.6);
rim.position.set(1.5, 3, 5);
scene.add(rim);

// Roblox part shapes (cylinders run along X), as in tools/preview/viewer.js
const GEOMETRY = {
  box: new THREE.BoxGeometry(1, 1, 1),
  cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 64, 1).rotateZ(Math.PI / 2),
  ycylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 64, 1),
  ball: new THREE.SphereGeometry(0.5, 64, 40),
};
const OUTLINE = { thickness: 0.0042, color: [0.11, 0.1, 0.2], alpha: 1 };

function materialFor(kind, opacity, color) {
  let material;
  if (kind === 'neon') {
    // Neon glows in the game: bright and nearly flat (a little shading keeps orbs round)
    material = new THREE.MeshStandardMaterial({ color: color.clone().multiplyScalar(0.45), roughness: 0.35,
      emissive: color.clone().lerp(new THREE.Color(1, 1, 1), 0.12).multiplyScalar(0.8) });
  } else if (kind === 'force') {
    material = new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.25 * opacity, depthWrite: false,
      blending: THREE.AdditiveBlending });
  } else {
    material = new THREE.MeshPhysicalMaterial({ color, roughness: 0.45, clearcoat: 0.45, clearcoatRoughness: 0.3 });
  }
  if (opacity < 1 && kind !== 'force') {
    material.transparent = true;
    material.opacity = opacity;
    material.depthWrite = false;
  }
  // see-through parts get no outline: its back-face shell would show through them as a solid Ink blob
  const outlined = kind !== 'force' && opacity >= 1;
  material.userData.outlineParameters = { ...OUTLINE, visible: outlined };
  return material;
}

const rows = await (await fetch(params.get('parts'))).json();
const model = new THREE.Group();
const matrix = new THREE.Matrix4();
for (const row of rows) {
  const [shape, kind, opacity] = row;
  const [x, y, z, a, b, c, d, e, f, g, h, k, sx, sy, sz] = row.slice(4, 19);
  const geometry = GEOMETRY[shape] || GEOMETRY.box;
  const color = new THREE.Color('#' + row[19]);
  const mesh = new THREE.Mesh(geometry, materialFor(kind, Number(opacity), color));
  matrix.set(a * sx, b * sy, c * sz, x, d * sx, e * sy, f * sz, y, g * sx, h * sy, k * sz, z, 0, 0, 0, 1);
  mesh.matrixAutoUpdate = false;
  mesh.matrix.copy(matrix);
  if (Number(opacity) < 1) mesh.renderOrder = 2;
  model.add(mesh);
}
scene.add(model);
model.updateMatrixWorld(true);

const box = new THREE.Box3().setFromObject(model);
const sphere = box.getBoundingSphere(new THREE.Sphere());
const fov = 30;
const camera = new THREE.PerspectiveCamera(fov, 1, 0.05, 5000);
const dir = new THREE.Vector3(Math.sin(azimuth) * Math.cos(elevation), Math.sin(elevation), -Math.cos(azimuth) * Math.cos(elevation));
const dist = sphere.radius / Math.sin(THREE.MathUtils.degToRad(fov / 2)) * 1.04 * fillFactor;
camera.position.copy(sphere.center).addScaledVector(dir, dist);
camera.lookAt(sphere.center);

const effect = new OutlineEffect(renderer, { defaultThickness: OUTLINE.thickness, defaultColor: OUTLINE.color });
effect.render(scene, camera);
document.title = 'done';
</script>
</body>
</html>
