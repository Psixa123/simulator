<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>World Prop Viewer</title>
<!--
  Preview renderer for the world prop pack (used by build_world_pack.py through headless Chromium;
  also works in a normal browser when the repo root is served over http, e.g.
  `python3 -m http.server` then /tools/world/viewer.html?prop=TreeRound).
  Query: ?prop=TreeRound&view=hero|front|side|back|top&size=512
         &glb=/assets/models/StormWorldProps.glb   (pack to load)
         &paints=Primary:FF7AB0,Secondary:FFD1E6     (preview a biome recolour)
         &outline=0|1  &shadow=0|1  &bg=0|1 (1 = sky gradient instead of a transparent background)
         &shade=standard|toon  (soft PBR shading like SmoothPlastic, or a soft toon ramp)  &ground=0 (show what is below ground)
-->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  body.sky { background: linear-gradient(#8fd6ff, #3b9cf2); }
  canvas { display: block; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./node_modules/three/build/three.module.js",
    "three/addons/": "./node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OutlineEffect } from 'three/addons/effects/OutlineEffect.js';

const params = new URLSearchParams(location.search);
const propId = params.get('prop') || 'TreeRound';
const view = params.get('view') || 'hero';
const size = Number(params.get('size') || 512);
const glbUrl = params.get('glb') || '../../assets/models/StormWorldProps.glb';
const useOutline = params.get('outline') !== '0';
const useShadow = params.get('shadow') !== '0';
const shade = params.get('shade') || 'standard';
if (params.get('bg') === '1') document.body.classList.add('sky');
const overrides = {};
for (const pair of (params.get('paints') || '').split(',')) {
  const [paint, hex] = pair.split(':');
  if (paint && hex) overrides[paint] = hex;
}

const INK = [35 / 255, 48 / 255, 102 / 255];
const OUTLINE = 0.0062;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NeutralToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

// Sunny, soft "Sky Lab" lighting: a strong sky/ground fill, a warm key from the front-left, a cool
// fill from the right and a white rim from behind.
const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xeef4ff, 0x7d72b0, 1.15));
const key = new THREE.DirectionalLight(0xfff0d8, 2.9);
key.position.set(3.0, 6.0, -4.5);
scene.add(key);
const fill = new THREE.DirectionalLight(0xcfe0ff, 0.5);
fill.position.set(-5, 2, -2);
scene.add(fill);
const rim = new THREE.DirectionalLight(0xffffff, 1.3);
rim.position.set(-1.5, 4, 6);
scene.add(rim);

// Soft toon ramp: a few smooth bands instead of a hard cel cut
function toonRamp() {
  const levels = [72, 96, 128, 166, 202, 228, 244, 252];
  const data = new Uint8Array(levels.length * 4);
  levels.forEach((v, i) => data.set([v, v, v, 255], i * 4));
  const tex = new THREE.DataTexture(data, levels.length, 1, THREE.RGBAFormat);
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  tex.needsUpdate = true;
  return tex;
}
const ramp = toonRamp();

function srgbHex(hex) {
  return new THREE.Color().setRGB(
    parseInt(hex.slice(0, 2), 16) / 255, parseInt(hex.slice(2, 4), 16) / 255, parseInt(hex.slice(4, 6), 16) / 255,
    THREE.SRGBColorSpace);
}

function glowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,0.9)');
  grad.addColorStop(0.35, 'rgba(255,255,255,0.35)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  return tex;
}

function shadowTexture() {
  const c = document.createElement('canvas');
  c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(35,48,102,0.55)');
  grad.addColorStop(0.55, 'rgba(35,48,102,0.28)');
  grad.addColorStop(1, 'rgba(35,48,102,0)');
  g.fillStyle = grad;
  g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}

function makeMaterial(info) {
  const kind = info.kind || 'Tint';
  const hex = (kind === 'Tint' && overrides[info.paint]) || info.rgb || 'C8C8C8';
  let mat;
  if (kind === 'Neon') {
    // glowing: white-hot where the surface faces the camera, the (deepened) paint colour at the rim
    mat = new THREE.ShaderMaterial({
      uniforms: { color: { value: srgbHex(hex) } },
      vertexShader: `varying vec3 vN; varying vec3 vV;
        void main() { vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal);
          vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform vec3 color; varying vec3 vN; varying vec3 vV;
        void main() { float f = clamp(dot(normalize(vN), normalize(vV)), 0.0, 1.0);
          vec3 rim = pow(color, vec3(1.7));
          gl_FragColor = vec4(mix(rim, vec3(1.0), pow(f, 1.6) * 0.92), 1.0);
          #include <colorspace_fragment>
        }`,
    });
  } else if (kind === 'Glass') {
    mat = new THREE.MeshPhongMaterial({ color: srgbHex(hex), transparent: true, opacity: 0.45, shininess: 90,
      depthWrite: false });
  } else if (shade === 'standard') {
    mat = new THREE.MeshStandardMaterial({ color: srgbHex(hex), roughness: 0.72, metalness: 0 });
  } else {
    mat = new THREE.MeshToonMaterial({ color: srgbHex(hex), gradientMap: ramp });
  }
  mat.userData.outlineParameters = { thickness: OUTLINE, color: INK, alpha: 1, visible: useOutline && kind !== 'Glass' };
  return mat;
}

const VIEWS = {
  hero: [-0.62, 0.5, -1],
  front: [0, 0.12, -1],
  side: [-1, 0.12, 0],
  back: [0.55, 0.45, 1],
  top: [0, 1, -0.3],
};

new GLTFLoader().load(glbUrl, (gltf) => {
  const source = gltf.scene.getObjectByName(propId);
  if (!source) {
    document.title = 'error: no prop ' + propId;
    return;
  }
  const prop = source.clone(true);
  prop.position.set(0, 0, 0);
  scene.add(prop);
  const visible = [];
  const glows = [];
  prop.traverse((o) => {
    if (!o.isMesh) return;
    const info = o.userData || {};
    if (info.paint === 'Root' || o.name.endsWith('.Root')) {
      o.visible = false;
      return;
    }
    o.material = makeMaterial(info);
    if (info.kind === 'Glass') o.renderOrder = 2;
    if (info.kind === 'Neon') glows.push([o, info]);
    visible.push(o);
  });
  prop.updateMatrixWorld(true);
  const box = new THREE.Box3();
  for (const o of visible) box.expandByObject(o);
  box.min.y = Math.max(box.min.y, 0);
  // Glow halo around glowing pieces: one per separate blob of a Neon mesh (a paint's blobs are merged
  // into one mesh, e.g. a crystal cluster's tips; in the game each glows on its own)
  function blobBoxes(o) {
    const pos = o.geometry.attributes.position;
    const count = pos.count;
    const parent = new Int32Array(count);
    for (let i = 0; i < count; i++) parent[i] = i;
    const find = (i) => { while (parent[i] !== i) { parent[i] = parent[parent[i]]; i = parent[i]; } return i; };
    const join = (a, b) => { a = find(a); b = find(b); if (a !== b) parent[a] = b; };
    const seen = new Map();  // vertices at the same spot (split by creases) belong together
    for (let i = 0; i < count; i++) {
      const key = [pos.getX(i), pos.getY(i), pos.getZ(i)].map((x) => Math.round(x * 100)).join(',');
      if (seen.has(key)) join(i, seen.get(key)); else seen.set(key, i);
    }
    const index = o.geometry.index;
    const tris = index ? index.count : count;
    const at = (k) => (index ? index.getX(k) : k);
    for (let t = 0; t + 2 < tris; t += 3) {
      join(at(t), at(t + 1));
      join(at(t), at(t + 2));
    }
    const boxes = new Map();
    const p = new THREE.Vector3();
    for (let i = 0; i < count; i++) {
      const r = find(i);
      if (!boxes.has(r)) boxes.set(r, new THREE.Box3());
      boxes.get(r).expandByPoint(p.fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld));
    }
    return [...boxes.values()];
  }
  for (const [o, info] of glows) {
    for (const b of blobBoxes(o)) {
      const s = b.getSize(new THREE.Vector3());
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTexture(), color: srgbHex(info.rgb),
        transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, opacity: 0.6 }));
      sprite.material.userData.outlineParameters = { visible: false };
      sprite.position.copy(b.getCenter(new THREE.Vector3()));
      sprite.scale.setScalar(Math.max(s.x, s.y, s.z) * 2.1);
      sprite.renderOrder = 3;
      scene.add(sprite);
    }
  }
  // The ground: anything below y = 0 is buried in the game. An invisible plane that only writes
  // depth hides it and keeps the background transparent.
  if (params.get('ground') !== '0') {
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(1000, 1000),
      new THREE.MeshBasicMaterial({ colorWrite: false, side: THREE.DoubleSide }));
    ground.material.userData.outlineParameters = { visible: false };
    ground.rotation.x = -Math.PI / 2;
    ground.renderOrder = -2;
    scene.add(ground);
  }
  // Soft contact shadow on the ground
  if (useShadow) {
    const size3 = box.getSize(new THREE.Vector3());
    const r = Math.max(size3.x, size3.z) * 0.62 + 0.4;
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(r * 2, r * 2),
      new THREE.MeshBasicMaterial({ map: shadowTexture(), transparent: true, depthWrite: false }));
    plane.material.userData.outlineParameters = { visible: false };
    plane.rotation.x = -Math.PI / 2;
    const c = box.getCenter(new THREE.Vector3());
    plane.position.set(c.x, 0.02, c.z);
    plane.renderOrder = -1;
    scene.add(plane);
  }
  // Frame the prop's bounding box tightly
  const fov = 28;
  const camera = new THREE.PerspectiveCamera(fov, 1, 0.05, 500);
  const dir = new THREE.Vector3(...(VIEWS[view] || VIEWS.hero)).normalize();
  const center = box.getCenter(new THREE.Vector3());
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  let dist = sphere.radius / Math.sin(THREE.MathUtils.degToRad(fov / 2));
  const corners = [];  // every few vertices of the visible pieces (a box is too loose for round props)
  for (const o of visible) {
    const pos = o.geometry.attributes.position;
    for (let i = 0; i < pos.count; i += 3) {
      const v = new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld);
      corners.push(v.setY(Math.max(v.y, 0)));
    }
  }
  for (let i = 0; i < 4; i++) {
    camera.position.copy(center).addScaledVector(dir, dist);
    camera.lookAt(center);
    camera.updateMatrixWorld(true);
    let extent = 0;
    for (const p of corners) {
      const q = p.clone().project(camera);
      extent = Math.max(extent, Math.abs(q.x), Math.abs(q.y));
    }
    dist *= extent / 0.84;
  }
  camera.position.copy(center).addScaledVector(dir, dist);
  camera.lookAt(center);
  const effect = new OutlineEffect(renderer, { defaultThickness: OUTLINE, defaultColor: INK });
  if (useOutline) effect.render(scene, camera);
  else renderer.render(scene, camera);
  document.title = 'done';
}, undefined, (err) => {
  document.title = 'error: ' + err;
});
</script>
</body>
</html>
