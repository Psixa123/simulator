<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Icon Viewer</title>
<!--
  Renderer for the 3D UI icons (tools/icons/render_icons.py drives it through headless Chromium; it also
  works in a normal browser when the repo root is served over http, e.g. `python3 -m http.server` then
  /tools/icons/viewer.html?icon=Volts&glb=/build/icons/StormIcons.glb).

  The page shows two square canvases side by side, `size` px each:
    left   the icon, shaded: soft toon terminator with a cool shadow tint, a crisp glossy highlight and a
           bright rim, on a transparent background (Glass pieces see-through)
    right  the same view as data for the ink lines: R = paint id (0 = background), G/B = depth in
           studs * 4096 (16 bit). render_icons.py turns it into the ink lines between parts and adds the
           thick silhouette outline and the drop shadow.
  Query: ?icon=Volts &glb=<pack url> &size=1024 &yaw=-24 &pitch=10 &roll=0 (degrees: camera turned right
         of the icon's front, raised above it, tilted) &fill=0.8 (share of the frame the icon spans)
         &lift=0.03 (shifts the icon up, room for the drop shadow) &noline=Color_FFFFFF,... (paints that
         get no ink line, e.g. shine streaks) &fov=24
         &metal=Color_FFB52E,... (paints shaded as polished metal: the toon shade plus a reflected sky, a dark
         horizon band and a stronger highlight; used by the store heroes for gold and steel)
         &matte=Color_C92A62,... (paints with only a faint highlight: velvet, cloth, straw, wood)
         &glass=0.34 (opacity of glass where it faces the camera; lower shows more of what is inside)
-->
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: transparent; }
  canvas { display: block; float: left; }
</style>
<script type="importmap">
{ "imports": {
    "three": "../world/node_modules/three/build/three.module.js",
    "three/addons/": "../world/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const params = new URLSearchParams(location.search);
const iconId = params.get('icon') || 'Volts';
const size = Number(params.get('size') || 1024);
const glbUrl = params.get('glb') || '../../build/icons/StormIcons.glb';
const yaw = THREE.MathUtils.degToRad(Number(params.get('yaw') || -24));
const pitch = THREE.MathUtils.degToRad(Number(params.get('pitch') || 10));
const roll = THREE.MathUtils.degToRad(Number(params.get('roll') || 0));
const fill = Number(params.get('fill') || 0.8);
const lift = Number(params.get('lift') || 0.03);
const fov = Number(params.get('fov') || 24);
const noLine = new Set((params.get('noline') || '').split(',').filter(Boolean));
const metal = new Set((params.get('metal') || '').split(',').filter(Boolean));
const matte = new Set((params.get('matte') || '').split(',').filter(Boolean));
const glassAlpha = Number(params.get('glass') || 0.34);
const DEPTH_SCALE = 4096;  // studs -> 16-bit depth steps

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(size, size);
renderer.setClearColor(0x000000, 0);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
document.body.appendChild(renderer.domElement);
const idCanvas = document.createElement('canvas');
idCanvas.width = idCanvas.height = size;
document.body.appendChild(idCanvas);
document.body.style.width = (2 * size) + 'px';

// ------------------------------------------------------------------ materials
// Lighting lives in view space, so every icon gets the same key light (upper left, towards the viewer)
// whatever angle it is shown from.
const shadeVertex = `
  varying vec3 vN; varying vec3 vV;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vN = normalize(normalMatrix * normal);
    vV = normalize(-mv.xyz);
    gl_Position = projectionMatrix * mv;
  }`;
const shadeFragment = `
  uniform vec3 base; uniform float kind; uniform float gloss;
  varying vec3 vN; varying vec3 vV;
  void main() {
    vec3 n = normalize(vN);
    if (!gl_FrontFacing) n = -n;
    vec3 v = normalize(vV);
    vec3 key = normalize(vec3(-0.58, 0.7, 0.5));
    float ndl = dot(n, key);
    float fres = pow(1.0 - clamp(dot(n, v), 0.0, 1.0), 2.6);
    vec3 col;
    float alpha = 1.0;
    if (kind > 0.5 && kind < 1.5) {
      // Neon: glows (also used for shine streaks): flat, a touch whiter in the middle
      col = mix(base, vec3(1.0), 0.35 * pow(clamp(dot(n, v), 0.0, 1.0), 2.0));
    } else {
      // soft toon: a smooth terminator; the shadow side is the paint deepened and more saturated
      // (gold -> orange, sky -> deep blue) with a little cool lavender, never grey
      float lit = smoothstep(-0.28, 0.22, ndl);
      float top = smoothstep(0.55, 0.85, ndl);
      vec3 shade = mix(pow(base, vec3(1.55)) * 0.78, base * vec3(0.5, 0.52, 0.86), 0.3);
      col = mix(shade, base, lit);
      col *= 0.9 + 0.1 * smoothstep(-0.2, 0.7, ndl);
      col = mix(col, min(base * 1.1 + 0.04, vec3(1.0)), top * 0.8);
      // bounce light from below keeps the shadow side from going muddy
      col += base * 0.08 * smoothstep(0.0, -0.8, n.y);
      if (kind > 2.5) {
        // Metal: the view-space reflection picks up a bright sky above, a dark horizon band and a warm floor,
        // so gold reads as polished metal instead of plastic
        vec3 r = reflect(-v, n);
        float sky = smoothstep(-0.02, 0.38, r.y);
        float band = 1.0 - smoothstep(0.0, 0.16, abs(r.y + 0.08));
        vec3 deep = pow(base, vec3(1.9)) * 0.7;
        col = mix(col, min(base * 1.16 + 0.08, vec3(1.0)), sky * 0.5);
        col = mix(col, deep, band * 0.42 * (1.0 - top));
      }
      // bright rim on the right / top edge
      float rimSide = smoothstep(-0.1, 0.55, dot(n, normalize(vec3(0.75, 0.5, -0.1))));
      col += vec3(0.92, 0.96, 1.0) * fres * 0.6 * rimSide;
      // glossy highlight: a crisp white blob plus a soft sheen around it
      vec3 h = normalize(key + v);
      float sp = max(dot(n, h), 0.0);
      col = mix(col, vec3(1.0), gloss * (0.88 * smoothstep(0.95, 0.972, sp) + 0.15 * smoothstep(0.8, 0.95, sp)));
      if (kind > 1.5 && kind < 2.5) {  // Glass: see-through in the middle, denser at the rim
        alpha = ${glassAlpha.toFixed(3)} + 0.55 * fres + 0.6 * smoothstep(0.955, 0.975, sp);
        col = mix(col, vec3(1.0), 0.18);
      }
    }
    gl_FragColor = vec4(col, clamp(alpha, 0.0, 1.0));
    #include <colorspace_fragment>
  }`;
const idVertex = `
  varying float vDepth;
  void main() {
    vec4 mv = modelViewMatrix * vec4(position, 1.0);
    vDepth = -mv.z;
    gl_Position = projectionMatrix * mv;
  }`;
const idFragment = `
  precision highp float;
  uniform float pid; uniform float near0;
  varying float vDepth;
  void main() {
    float d = clamp((vDepth - near0) * ${DEPTH_SCALE.toFixed(1)}, 0.0, 65535.0);
    float hi = floor(d / 256.0);
    float lo = d - hi * 256.0;
    gl_FragColor = vec4(pid / 255.0, hi / 255.0, floor(lo) / 255.0, 1.0);
  }`;

function srgbHex(hex) {
  return new THREE.Color().setRGB(parseInt(hex.slice(0, 2), 16) / 255, parseInt(hex.slice(2, 4), 16) / 255,
    parseInt(hex.slice(4, 6), 16) / 255, THREE.SRGBColorSpace);
}

function shadeMaterial(info) {
  const kind = info.kind === 'Neon' ? 1 : info.kind === 'Glass' ? 2 : metal.has(info.paint) ? 3 : 0;
  const mat = new THREE.ShaderMaterial({
    uniforms: { base: { value: srgbHex(info.rgb || 'C8C8C8') }, kind: { value: kind },
      gloss: { value: matte.has(info.paint) ? 0.22 : 1.0 } },
    vertexShader: shadeVertex, fragmentShader: shadeFragment,
    transparent: kind === 2, depthWrite: kind !== 2, side: kind === 2 ? THREE.DoubleSide : THREE.FrontSide,
  });
  return mat;
}

// ------------------------------------------------------------------ scene
new GLTFLoader().load(glbUrl, (gltf) => {
  const source = gltf.scene.getObjectByName(iconId);
  if (!source) {
    document.title = 'error: no icon ' + iconId;
    return;
  }
  const icon = source.clone(true);
  icon.position.set(0, 0, 0);
  const scene = new THREE.Scene();
  scene.add(icon);
  const meshes = [];
  const paintIds = new Map();
  icon.traverse((o) => {
    if (!o.isMesh) return;
    const info = o.userData || {};
    if (info.paint === 'Root' || o.name.endsWith('.Root')) {
      o.visible = false;
      return;
    }
    if (!paintIds.has(info.paint)) paintIds.set(info.paint, paintIds.size + 1);
    o.material = shadeMaterial(info);
    if (info.kind === 'Glass') o.renderOrder = 2;
    meshes.push([o, info]);
  });
  icon.updateMatrixWorld(true);

  // Frame the icon: point the camera from (yaw, pitch), then move and zoom until the projected icon spans
  // `fill` of the frame, centred (shifted up by `lift`).
  const pts = [];
  for (const [o] of meshes) {
    const pos = o.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) pts.push(new THREE.Vector3().fromBufferAttribute(pos, i).applyMatrix4(o.matrixWorld));
  }
  const box = new THREE.Box3().setFromPoints(pts);
  const sphere = box.getBoundingSphere(new THREE.Sphere());
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  const camera = new THREE.PerspectiveCamera(fov, 1, 0.05, 1000);
  const target = sphere.center.clone();
  let dist = sphere.radius / Math.sin(THREE.MathUtils.degToRad(fov / 2));
  const place = () => {
    camera.position.copy(target).addScaledVector(dir, dist);
    camera.up.set(0, 1, 0);
    camera.lookAt(target);
    camera.rotateZ(roll);
    camera.updateMatrixWorld(true);
  };
  for (let it = 0; it < 8; it++) {
    place();
    let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
    for (const p of pts) {
      const q = p.clone().project(camera);
      x0 = Math.min(x0, q.x); x1 = Math.max(x1, q.x); y0 = Math.min(y0, q.y); y1 = Math.max(y1, q.y);
    }
    const half = Math.tan(THREE.MathUtils.degToRad(fov / 2)) * dist;
    const right = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 0);
    const up = new THREE.Vector3().setFromMatrixColumn(camera.matrixWorld, 1);
    target.addScaledVector(right, ((x0 + x1) / 2) * half).addScaledVector(up, ((y0 + y1) / 2 - lift) * half);
    dist *= Math.max(x1 - x0, y1 - y0) / 2 / fill;
  }
  place();

  // 1) the shaded icon
  renderer.render(scene, camera);

  // 2) paint ids + depth (no antialiasing) for the ink lines
  const near0 = Math.max(0.01, dist - sphere.radius * 1.5);
  const idMats = new Map();
  for (const [o, info] of meshes) {
    o.userData.shadeMaterial = o.material;
    if (info.kind === 'Glass' || noLine.has(info.paint)) {
      o.visible = false;
      continue;
    }
    if (!idMats.has(info.paint)) {
      idMats.set(info.paint, new THREE.ShaderMaterial({
        uniforms: { pid: { value: paintIds.get(info.paint) }, near0: { value: near0 } },
        vertexShader: idVertex, fragmentShader: idFragment,
      }));
    }
    o.material = idMats.get(info.paint);
  }
  const rt = new THREE.WebGLRenderTarget(size, size, { type: THREE.UnsignedByteType, samples: 0,
    depthBuffer: true, minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter });
  rt.texture.colorSpace = THREE.NoColorSpace;
  const idRenderer = renderer;
  idRenderer.setRenderTarget(rt);
  idRenderer.setClearColor(0x000000, 1);
  idRenderer.clear();
  idRenderer.render(scene, camera);
  const buf = new Uint8Array(size * size * 4);
  idRenderer.readRenderTargetPixels(rt, 0, 0, size, size, buf);
  idRenderer.setRenderTarget(null);
  const ctx = idCanvas.getContext('2d');
  const img = ctx.createImageData(size, size);
  for (let y = 0; y < size; y++) {
    const src = (size - 1 - y) * size * 4;
    img.data.set(buf.subarray(src, src + size * 4), y * size * 4);
  }
  for (let i = 3; i < img.data.length; i += 4) img.data[i] = 255;
  ctx.putImageData(img, 0, 0);
  document.title = 'done';
}, undefined, (err) => {
  document.title = 'error: ' + err;
});
</script>
</body>
</html>
